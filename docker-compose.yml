services:
  nginx-proxy:
    image: nginx
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - korp-network
    depends_on:
      - http-server-projeto-korp

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - "--nginx.scrape-uri=http://nginx:8081/status"
    networks:
      - korp-network
    depends_on:
      - nginx-proxy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - korp-network
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - nginx-exporter

  http-server-projeto-korp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: http-server-projeto-korp
    networks:
      - korp-network
    restart: unless-stopped

networks:
  korp-network:
    driver: bridge
